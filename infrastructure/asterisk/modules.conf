; Module allow-list. `autoload = no` means ONLY the modules named below are loaded; everything else that exists on disk
; stays unloaded. There is no AMI, ARI, HTTP, AGI, shell, voicemail, queue, conference, trunk or outbound-registration module.
; `sparta doctor --provider asterisk` and scripts/sip_e2e.py check that list from the outside.

[modules]
autoload = no
; `ENV()` is used in extensions.conf's [globals], which pbx_config evaluates while it loads: its module must exist before.
preload = func_env.so

; --- SIP (PJSIP over UDP) ---------------------------------------------------------------------------------------------
load = res_pjproject.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so
load = res_pjsip.so
load = res_pjsip_session.so
load = res_pjsip_pubsub.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_registrar.so
load = res_pjsip_nat.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_caller_id.so
load = res_pjsip_dtmf_info.so
load = res_pjsip_rfc3326.so
load = res_pjsip_acl.so
load = chan_pjsip.so

; --- media: G.711 only, plain RTP ------------------------------------------------------------------------------------
load = res_rtp_asterisk.so
load = res_timing_timerfd.so
load = codec_ulaw.so
load = codec_alaw.so
load = bridge_simple.so
load = bridge_native_rtp.so
load = res_security_log.so

; --- dialplan --------------------------------------------------------------------------------------------------------
load = pbx_config.so
load = app_dial.so
load = res_audiosocket.so
load = app_audiosocket.so
load = res_curl.so
load = func_curl.so
load = func_callerid.so
load = func_channel.so
load = func_cut.so
load = func_strings.so
load = func_uri.so
load = func_logic.so
load = func_groupcount.so
load = func_timeout.so
load = func_env.so
load = func_global.so
load = func_devstate.so

; Names that must never load even if autoload were switched on by mistake.
noload = app_system.so
noload = func_shell.so
noload = app_originate.so
noload = res_agi.so
noload = res_ari.so
noload = res_stasis.so
noload = res_http_websocket.so
noload = chan_websocket.so
noload = res_pjsip_outbound_registration.so
noload = res_pjsip_outbound_publish.so
noload = res_pjsip_refer.so
