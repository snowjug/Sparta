; Sparta local-SIP dialplan.
;
; The only extension a SIP phone can dial is 6000 (Sparta, the AI call assistant). There is no trunk, no outbound or PSTN
; route, no wildcard dial pattern: everything else hangs up. 6002 (the owner's phone) is rung only by the take-over step
; below, and only when Sparta says so over its authenticated callback.
;
; Control flow for 6000:
;   1. POST /incoming (HTTP Basic with the shared secret) -> "ACCEPT <single-use media id>" or "REJECT <reason>"
;   2. Answer, then AudioSocket(<media id>, sparta:8090): two-way 8 kHz PCM until Sparta or the caller ends it
;   3. When the socket closes gracefully: POST /next -> "DIAL 6002" (take-over) or "HANGUP"
;   4. On hang-up: POST /ended (status of the owner leg, if there was one)
; Every value sent to Sparta is filtered and URL-encoded here, and validated again there. The secret is read from the
; environment at run time and is never logged (asterisk.conf and logger.conf keep verbose/debug off).

[general]
static = yes
writeprotect = yes
autofallthrough = yes
clearglobalvars = no

[globals]
MAXCALLS = ${ENV(ASTERISK_MAX_CALLS)}
MAXSECS = ${ENV(ASTERISK_MAX_CALL_SECONDS)}
SPARTA_URL = http://${ENV(SPARTA_API_HOST)}:${ENV(SPARTA_API_PORT)}/api/v1/webhooks/asterisk
SPARTA_MEDIA = ${ENV(SPARTA_API_HOST)}:${ENV(SPARTA_MEDIA_PORT)}

[from-sparta-sip]
exten => 6000,1,Set(SPARTA_CALL=0)
 same => n,Set(CALLER=${FILTER(0-9A-Za-z_.+-,${CALLERID(num)})})
 ; At most MAXCALLS calls at once and MAXSECS seconds per call, whatever Sparta says.
 same => n,Set(GROUP()=sparta)
 same => n,GotoIf($[${GROUP_COUNT(sparta)} > ${MAXCALLS}]?busy)
 same => n,Set(TIMEOUT(absolute)=${MAXSECS})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CURLOPT(userpwd)=asterisk:${ENV(SPARTA_WEBHOOK_SECRET)})
 same => n,Set(REPLY=${CURL(${SPARTA_URL}/incoming,channel=${UNIQUEID}&caller=${URIENCODE(${CALLER})}&exten=${EXTEN})})
 same => n,GotoIf($["${REPLY:0:7}" = "ACCEPT "]?accepted)
 same => n,GotoIf($["${REPLY}" = "REJECT busy"]?busy)
 same => n,Hangup(21)
 same => n(busy),Busy(5)
 same => n,Hangup()
 same => n(accepted),Set(MEDIA_ID=${REPLY:7})
 ; The media id must look like a UUID (36 characters of hex digits and dashes) before it is used as an argument.
 same => n,GotoIf($[${LEN(${MEDIA_ID})} != 36 | "${FILTER(0-9a-f-,${MEDIA_ID})}" != "${MEDIA_ID}"]?bad)
 same => n,Set(SPARTA_CALL=1)
 same => n,Answer()
 same => n,AudioSocket(${MEDIA_ID},${SPARTA_MEDIA})
 ; AudioSocket returns here (return code 0) only when Sparta closed the socket: a hang-up or a take-over.
 same => n,Set(NEXT=${CURL(${SPARTA_URL}/next,channel=${UNIQUEID})})
 same => n,GotoIf($["${NEXT:0:5}" = "DIAL "]?takeover)
 same => n,Hangup()
 same => n(takeover),GotoIf($["${NEXT:5}" != "6002"]?bad)
 same => n,Dial(PJSIP/6002,30,r)
 same => n,Hangup()
 same => n(bad),Hangup(21)

; Anything else a phone dials (including 6001, 6002 and any number) is refused. There is no route to a trunk because there is
; no trunk.
exten => _X.,1,Hangup(1)
exten => i,1,Hangup(1)
exten => t,1,Hangup()

; Runs after every call that was handed to Sparta, whoever hung up: tells Sparta the call is over (idempotent there).
exten => h,1,GotoIf($["${SPARTA_CALL}" != "1"]?done)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CURLOPT(userpwd)=asterisk:${ENV(SPARTA_WEBHOOK_SECRET)})
 same => n,Set(OWNER_LEG=${IF($["${DIALSTATUS}" = ""]?-:${FILTER(A-Z_,${DIALSTATUS})})})
 same => n,Set(ENDED=${CURL(${SPARTA_URL}/ended,channel=${UNIQUEID}&status=${OWNER_LEG})})
 same => n(done),NoOp()
