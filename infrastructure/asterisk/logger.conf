; Logging: notices, warnings and errors to the container's standard output, and nothing else.
; Do NOT add `verbose` or `debug` here: those levels print dialplan application data after variable expansion, which would
; write the callback secret into the container log (see asterisk.conf).

[general]
dateformat = %F %T
use_callids = yes
appendhostname = no
queue_log = no
event_log = no
rotatestrategy = none

[logfiles]
console => notice,warning,error
