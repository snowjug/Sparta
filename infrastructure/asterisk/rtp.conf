; RTP: a small fixed port range (Docker publishes exactly these UDP ports; keep it in step with docker-compose.yml and
; EXPOSE in the Dockerfile). Two ports per call (RTP + RTCP), so this is plenty for the call limit.

[general]
rtpstart = 10000
rtpend = 10019
; Drop packets whose UDP checksum is wrong.
rtpchecksums = yes
; Once the far end's RTP source is learned, drop RTP from any other source: this is the defence against RTP injection into
; a live call by a third party who can reach the RTP ports.
strictrtp = yes
; No STUN, no TURN, no ICE: nothing in this stack talks to the internet.
icesupport = no
rtcpinterval = 5000
