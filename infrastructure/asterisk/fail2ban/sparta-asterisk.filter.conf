# fail2ban filter for the Sparta Asterisk container (Linux hosts). It matches what Asterisk logs when a SIP client fails to
# authenticate or names a user that does not exist. The end-to-end test (services/api/tests/e2e_sip) applies this exact
# expression to the real container output, so it cannot drift from what Asterisk 22 prints without that test failing.
#
# The line is unanchored on purpose: with Docker's default json-file log driver each line is wrapped in {"log":"..."}.
#
# Install (as root): copy this file to /etc/fail2ban/filter.d/sparta-asterisk.conf and jail.sparta-asterisk.conf to
# /etc/fail2ban/jail.d/sparta-asterisk.conf, then `fail2ban-client reload`. See infrastructure/asterisk/README.md,
# "Failed logins", for what this does NOT cover.

[Definition]
failregex = log_failed_request: Request '[A-Z]+' from '[^']*' failed for '<HOST>:\d+' \(callid: [^)]*\) - (?:Failed to authenticate|No matching endpoint found)

ignoreregex =
