# Sample fail2ban jail for the Sparta Asterisk container. NOT TESTED: it was written from fail2ban's documentation and has not
# been run on a Linux host (the filter's regular expression IS tested, against real container output).
#
# Only for a Linux host where Docker keeps the real source address of published UDP traffic. Docker Desktop (Windows, macOS)
# presents every sender as one gateway address: there, banning that address would lock out every phone, so do not use it.
#
# Install: copy sparta-asterisk.filter.conf to /etc/fail2ban/filter.d/sparta-asterisk.conf and this file to
# /etc/fail2ban/jail.d/sparta-asterisk.conf. Published container ports are filtered in the DOCKER-USER chain, not INPUT.
#
# Replace the container name with yours (`docker ps`), or read the container's json log file if you use that log driver.

[sparta-asterisk]
enabled = true
filter = sparta-asterisk
backend = systemd
journalmatch = CONTAINER_NAME=sparta-asterisk-1
port = 5060
protocol = udp
chain = DOCKER-USER
banaction = iptables-allports
maxretry = 5
findtime = 10m
bantime = 1h
