; Sparta local-SIP Asterisk: core options. Copied to /etc/asterisk by entrypoint.sh.

[options]
; Nothing verbose, nothing debug. Asterisk logs the EXPANDED arguments of every dialplan application at verbose level 3
; and above, and the dialplan's callback password is one of them: the logger (logger.conf) does not enable those levels
; and this keeps them off for the console as well. scripts/sip_e2e.py greps the container output for the generated
; secrets after a real call.
verbose = 0
debug = 0
; A second line of defence behind the dialplan's GROUP() limit and Sparta's own limit.
maxcalls = 8
maxload = 8.0
; No command execution from the dialplan or from the network.
live_dangerously = no
internal_timing = yes
transmit_silence = no
documentation_language = en
; Messages about config files that are intentionally absent (voicemail, queues, ...) are not warnings here.
dontwarn = yes

[files]
; The control socket used by `asterisk -rx` (the health check) lives inside the container only.
astctlpermissions = 0660
astctl = asterisk.ctl
