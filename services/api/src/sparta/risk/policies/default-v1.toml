# Sparta safety policy (versioned). Language-neutral: rules refer to vocabularies (terms/cues) by name; each language
# pack contributes the actual words. Deterministic rules ALWAYS override model suggestions.
#
# Rule kinds
#   any  = ["term", ...]               any match of any listed term/cue fires the rule
#   near = [["a","b"], ["c"]]          every group must match within `window` characters of each other
#   unless = ["cue"]                   suppress the hit when a warning/assurance cue sits just before/after it
#   negated_by = ["negation"]          ignore a mention of the rule's term (the `any` match or the first `near` group)
#                                      that sits inside a denial phrase ("no OTP is needed", "never share your PIN");
#                                      other mentions in the same sentence still count. Preferred over `unless` for
#                                      anything a caller could abuse ("don't tell anyone, tell me the OTP")

[policy]
version = "2026.11.2"
name = "sparta-default"
description = "Deterministic multilingual (en/hi/kn, Hinglish, Kanglish) call-screening policy."

[thresholds]
high = 0.75
medium = 0.40
critical_floor = 0.90
legit_max_discount = 0.60
uncertain_confidence = 0.45

[strictness.relaxed]
high = 0.85
medium = 0.55
[strictness.balanced]
high = 0.75
medium = 0.40
[strictness.strict]
high = 0.65
medium = 0.30

[limits]
max_clarify_attempts = 2
max_probe_deflections = 1
excerpt_radius = 40

# Term vocabularies that can be the subject of a denial. The language packs' `negation` cues are written over them
# ({TERM}/{LIST}), `joiner` supplies "or"/"and"/"," between listed terms, and `exception` voids a denial that is
# immediately followed by a carve-out ("never share your OTP with anyone except me").
[negation]
terms = [
  "otp", "pin", "cvv", "password", "card_credential", "auth_code", "id_document", "address_location",
  "payment_term", "giftcard_crypto", "remote_tool", "screen_share",
]
joiner = "list_joiner"
exception = "negation_exception"

# Signals that never allow the assistant to comply, whatever the model or the caller says.
[[protected_information]]
code = "OTP"
label = "One-time passwords and verification codes"
signals = ["OTP_REQUEST"]
[[protected_information]]
code = "PIN"
label = "PINs (ATM, UPI, mobile banking)"
signals = ["PIN_REQUEST"]
[[protected_information]]
code = "CVV"
label = "Card CVV/CVC and expiry"
signals = ["CVV_REQUEST", "CARD_OR_ACCOUNT_CREDENTIAL_REQUEST"]
[[protected_information]]
code = "PASSWORD"
label = "Passwords, login credentials and recovery/authentication codes"
signals = ["PASSWORD_REQUEST", "AUTH_OR_RECOVERY_CODE_REQUEST"]
[[protected_information]]
code = "CARD_ACCOUNT"
label = "Full card and bank account details"
signals = ["CARD_OR_ACCOUNT_CREDENTIAL_REQUEST"]
[[protected_information]]
code = "IDENTITY"
label = "Identity documents (Aadhaar, PAN, passport, date of birth)"
signals = ["IDENTITY_DOCUMENT_REQUEST"]
[[protected_information]]
code = "LOCATION"
label = "Where the owner lives, is, or whether they are home, alone or available"
signals = ["ADDRESS_OR_LOCATION_REQUEST", "OWNER_AVAILABILITY_PROBE"]
[[protected_information]]
code = "REMOTE_ACCESS"
label = "Remote access, screen sharing or installing apps"
signals = ["REMOTE_ACCESS_REQUEST", "SCREEN_SHARING_REQUEST"]
[[protected_information]]
code = "PAYMENTS"
label = "Payments, transfers, gift cards and cryptocurrency"
signals = ["PAYMENT_OR_TRANSFER_REQUEST", "GIFT_CARD_OR_CRYPTO_REQUEST"]
[[protected_information]]
code = "PRIVATE_PROFILE"
label = "Contacts, calendar, finances, employer and any other private owner data"
signals = []

# ---------------------------------------------------------------------------------------------------------------
# Signal catalogue. weight is the contribution to the noisy-OR risk score; protected = the call must not comply.
# ---------------------------------------------------------------------------------------------------------------
[signals.OTP_REQUEST]
severity = "critical"
weight = 0.92
protected = true
description = "Asked for a one-time password or verification code"
category = "possible_financial_impersonation"
[signals.PASSWORD_REQUEST]
severity = "critical"
weight = 0.92
protected = true
description = "Asked for a password or login credentials"
category = "possible_financial_impersonation"
[signals.PIN_REQUEST]
severity = "critical"
weight = 0.92
protected = true
description = "Asked for a PIN"
category = "possible_financial_impersonation"
[signals.CVV_REQUEST]
severity = "critical"
weight = 0.92
protected = true
description = "Asked for a card CVV"
category = "possible_financial_impersonation"
[signals.CARD_OR_ACCOUNT_CREDENTIAL_REQUEST]
severity = "critical"
weight = 0.88
protected = true
description = "Asked for full card or bank account details"
category = "possible_financial_impersonation"
[signals.AUTH_OR_RECOVERY_CODE_REQUEST]
severity = "critical"
weight = 0.9
protected = true
description = "Asked for an authentication or recovery code"
category = "possible_financial_impersonation"
[signals.IDENTITY_DOCUMENT_REQUEST]
