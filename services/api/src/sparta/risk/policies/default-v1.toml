severity = "info"
weight = 0.6
description = "Delivery coordination"
category = "legitimate_delivery"
[signals.LEGIT_APPOINTMENT_CONFIRMATION]
kind = "legitimate"
severity = "info"
weight = 0.55
description = "Appointment or booking confirmation"
category = "legitimate_appointment"
[signals.LEGIT_RECRUITER_INTRO]
kind = "legitimate"
severity = "info"
weight = 0.55
description = "Recruiter or interview scheduling"
category = "legitimate_recruiter"
[signals.LEGIT_KNOWN_SERVICE_CALLBACK]
kind = "legitimate"
severity = "info"
weight = 0.5
description = "Callback about something the owner did"
category = "legitimate_support_callback"
[signals.LEGIT_FAMILY_OR_FRIEND]
kind = "legitimate"
severity = "info"
weight = 0.5
description = "Family, friend or colleague"
category = "legitimate_personal"
[signals.LEGIT_SCHOOL_OR_HOSPITAL]
kind = "legitimate"
severity = "info"
weight = 0.55
description = "School, college or hospital contact"
category = "legitimate_urgent"
[signals.LEGIT_EMERGENCY_CONTEXT]
kind = "legitimate"
severity = "info"
weight = 0.7
description = "Possible emergency involving a person"
category = "legitimate_urgent"
[signals.LEGIT_SUPPORT_CALLBACK]
kind = "legitimate"
severity = "info"
weight = 0.55
description = "Support follow-up referencing a case or ticket"
category = "legitimate_support_callback"

# ---------------------------------------------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------------------------------------------
[[rules]]
signal = "OTP_REQUEST"
near = [["otp"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "OTP_REQUEST"
near = [["otp"], ["received_probe"]]
window = 60
negated_by = ["negation"]
[[rules]]
signal = "PASSWORD_REQUEST"
near = [["password"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "PIN_REQUEST"
near = [["pin"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "CVV_REQUEST"
near = [["cvv"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "CARD_OR_ACCOUNT_CREDENTIAL_REQUEST"
near = [["card_credential"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "AUTH_OR_RECOVERY_CODE_REQUEST"
near = [["auth_code"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "IDENTITY_DOCUMENT_REQUEST"
near = [["id_document"], ["request"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "ADDRESS_OR_LOCATION_REQUEST"
near = [["address_location"], ["request"]]
window = 80
negated_by = ["negation"]

# Weak cues ("please", "what is", "need") only count when immediately next to the sensitive term.
[[rules]]
signal = "OTP_REQUEST"
near = [["otp"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "PASSWORD_REQUEST"
near = [["password"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "PIN_REQUEST"
near = [["pin"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "CVV_REQUEST"
near = [["cvv"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "CARD_OR_ACCOUNT_CREDENTIAL_REQUEST"
near = [["card_credential"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "AUTH_OR_RECOVERY_CODE_REQUEST"
near = [["auth_code"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "IDENTITY_DOCUMENT_REQUEST"
near = [["id_document"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "ADDRESS_OR_LOCATION_REQUEST"
near = [["address_location"], ["request_weak"]]
window = 30
negated_by = ["negation"]
[[rules]]
signal = "OWNER_AVAILABILITY_PROBE"
any = ["owner_availability"]
[[rules]]
signal = "REMOTE_ACCESS_REQUEST"
any = ["remote_tool"]
negated_by = ["negation"]
[[rules]]
signal = "REMOTE_ACCESS_REQUEST"
near = [["install_app"], ["bank_org", "govt_org", "police_org", "kyc", "account_threat", "legal_threat", "urgency"]]
window = 140
severity = "high"
weight = 0.7
[[rules]]
signal = "SCREEN_SHARING_REQUEST"
any = ["screen_share"]
negated_by = ["negation"]
[[rules]]
signal = "PAYMENT_OR_TRANSFER_REQUEST"
near = [["payment_term"], ["pay_demand"]]
window = 70
unless = ["no_money_assurance"]
negated_by = ["negation"]
[[rules]]
signal = "GIFT_CARD_OR_CRYPTO_REQUEST"
near = [["giftcard_crypto"], ["buy_send", "pay_demand"]]
window = 80
negated_by = ["negation"]
[[rules]]
signal = "MALICIOUS_LINK_OR_CALLBACK"
any = ["link_callback"]
unless = ["warning"]
[[rules]]
signal = "ARREST_OR_LEGAL_THREAT"
any = ["legal_threat"]
unless = ["warning"]
[[rules]]
signal = "ACCOUNT_CLOSURE_THREAT"
any = ["account_threat"]
unless = ["warning"]
[[rules]]
signal = "FAKE_KYC_URGENCY"
near = [["kyc"], ["kyc_action"]]
window = 60
[[rules]]
signal = "URGENCY_PRESSURE"
any = ["urgency"]
[[rules]]
signal = "URGENCY_PRESSURE"
any = ["isolation"]
severity = "medium"
weight = 0.5
[[rules]]
signal = "SUSPICIOUS_PRIZE"
any = ["prize"]
[[rules]]
signal = "IMPERSONATION_BANK"
near = [["bank_org"], ["claim"]]
window = 70
[[rules]]
signal = "IMPERSONATION_GOVERNMENT"
near = [["govt_org"], ["claim"]]
window = 70
[[rules]]
signal = "IMPERSONATION_POLICE"
near = [["police_org"], ["claim"]]
window = 70
[[rules]]
signal = "IMPERSONATION_COURIER"
near = [["courier_org"], ["claim"]]
window = 70
[[rules]]
signal = "IMPERSONATION_EMPLOYER"
near = [["employer_org"], ["claim"]]
window = 70
[[rules]]
signal = "RULE_OVERRIDE_ATTEMPT"
any = ["override_phrase"]
[[rules]]
signal = "RULE_OVERRIDE_ATTEMPT"
any = ["authority_demand"]
severity = "high"
weight = 0.6
[[rules]]
signal = "FALSE_OWNER_AUTHORIZATION"
near = [["owner_authorization"], ["otp", "pin", "cvv", "password", "card_credential", "auth_code", "id_document", "address_location", "owner_availability", "payment_term", "remote_tool"]]
window = 120
[[rules]]
signal = "HARASSMENT_OR_ABUSE"
any = ["abuse"]
[[rules]]
signal = "HARASSMENT_OR_ABUSE"
any = ["harassment_threat"]
weight = 0.8
[[rules]]
signal = "TELEMARKETING"
any = ["telemarketing"]
[[rules]]
signal = "LEGIT_DELIVERY_COORDINATION"
any = ["delivery_coord"]
[[rules]]
signal = "LEGIT_APPOINTMENT_CONFIRMATION"
any = ["appointment"]
[[rules]]
signal = "LEGIT_RECRUITER_INTRO"
any = ["recruiter"]
[[rules]]
signal = "LEGIT_KNOWN_SERVICE_CALLBACK"
any = ["known_callback"]
[[rules]]
signal = "LEGIT_FAMILY_OR_FRIEND"
any = ["family_friend"]
[[rules]]
signal = "LEGIT_SCHOOL_OR_HOSPITAL"
any = ["school_hospital"]
[[rules]]
signal = "LEGIT_EMERGENCY_CONTEXT"
near = [["emergency"], ["family_member", "school_hospital"]]
window = 150
[[rules]]
signal = "LEGIT_EMERGENCY_CONTEXT"
any = ["emergency"]
weight = 0.4
[[rules]]
signal = "LEGIT_SUPPORT_CALLBACK"
any = ["support_callback"]
