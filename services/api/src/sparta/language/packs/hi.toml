# Hindi utterances. Devanagari text for the speech provider; Latin transliteration for developers/testers.
# Wording avoids first-person gendered verb forms so the voice's gender does not matter.
[templates.disclosure.concise]
text = "नमस्ते, मैं {owner_poss} AI कॉल असिस्टेंट हूँ। आपका नाम और कॉल का कारण बता सकते हैं?"
translit = "Namaste, main {owner_poss} AI call assistant hoon. Aapka naam aur call ka reason bata sakte hain?"
[templates.disclosure.warm]
text = "नमस्ते! आप {owner_poss} AI कॉल असिस्टेंट से बात कर रहे हैं। कृपया अपना नाम और कॉल का कारण बताइए।"
translit = "Namaste! Aap {owner_poss} AI call assistant se baat kar rahe hain. Kripya apna naam aur call ka karan bataiye."
[templates.disclosure.formal]
text = "नमस्कार। मैं {owner_poss} AI कॉल असिस्टेंट हूँ। कृपया अपना नाम और कॉल का उद्देश्य बताएँ।"
translit = "Namaskar. Main {owner_poss} AI call assistant hoon. Kripya apna naam aur call ka uddeshya bataiye."
[templates.ask_name.default]
text = "क्षमा करें, आपका नाम क्या है?"
translit = "Kshama karein, aapka naam kya hai?"
[templates.ask_org.default]
text = "और आप किस कंपनी या संस्था से बात कर रहे हैं?"
translit = "Aur aap kis company ya sanstha se baat kar rahe hain?"
[templates.ask_purpose.default]
text = "धन्यवाद। यह कॉल किस बारे में है?"
translit = "Dhanyavaad. Yeh call kis baare mein hai?"
[templates.clarify_repeat.default]
text = "माफ़ कीजिए, बात स्पष्ट नहीं सुनाई दी। क्या आप दोबारा बता सकते हैं?"
translit = "Maaf kijiye, baat spasht nahin sunai di. Kya aap dobara bata sakte hain?"
[templates.reprompt_silence.default]
text = "हैलो, क्या आप लाइन पर हैं?"
translit = "Hello, kya aap line par hain?"
[templates.close_silence.default]
text = "कुछ सुनाई नहीं दे रहा है, इसलिए यह कॉल समाप्त की जा रही है। धन्यवाद।"
translit = "Kuch sunai nahin de raha hai, isliye yeh call samapt ki ja rahi hai. Dhanyavaad."
[templates.refuse_sensitive.default]
text = "क्षमा करें, इस कॉल पर कोई भी व्यक्तिगत, वित्तीय या सुरक्षा संबंधी जानकारी न दी जा सकती है, न ली जा सकती है।"
translit = "Kshama karein, is call par koi bhi vyaktigat, vittiya ya suraksha sambandhi jaankari na di ja sakti hai, na li ja sakti hai."
[templates.end_scam.default]
text = "यह कॉल अब समाप्त की जा रही है। धन्यवाद।"
translit = "Yeh call ab samapt ki ja rahi hai. Dhanyavaad."
[templates.end_spam.default]
text = "कॉल करने के लिए धन्यवाद, लेकिन इस विषय में मदद नहीं की जा सकती। धन्यवाद।"
translit = "Call karne ke liye dhanyavaad, lekin is vishay mein madad nahin ki ja sakti. Dhanyavaad."
[templates.escalate_hold.default]
text = "धन्यवाद। {owner_to} अभी सूचित किया जा रहा है। कृपया लाइन पर बने रहें।"
translit = "Dhanyavaad. {owner_to} abhi suchit kiya ja raha hai. Kripya line par bane rahein."
[templates.escalate_waiting.default]
text = "धन्यवाद, यह नोट कर लिया गया है। {owner_subj} को सूचित कर दिया गया है, कृपया लाइन पर बने रहें।"
translit = "Dhanyavaad, yeh note kar liya gaya hai. {owner_subj} ko suchit kar diya gaya hai, kripya line par bane rahein."
[templates.take_message.default]
text = "आपका संदेश आगे पहुँचा दिया जाएगा। कृपया छोटा संदेश और कॉलबैक नंबर बताइए।"
translit = "Aapka sandesh aage pahuncha diya jayega. Kripya chhota sandesh aur callback number bataiye."
[templates.safe_continue.default]
text = "धन्यवाद, यह नोट कर लिया गया है। क्या कुछ और बताना है?"
translit = "Dhanyavaad, yeh note kar liya gaya hai. Kya kuch aur batana hai?"
[templates.owner_takeover.default]
text = "{owner_subj} अभी कॉल पर आ रहे हैं। कृपया एक क्षण रुकिए।"
translit = "{owner_subj} abhi call par aa rahe hain. Kripya ek kshan rukiye."
[templates.owner_continue.default]
text = "प्रतीक्षा के लिए धन्यवाद। कृपया थोड़ा और बताइए कि यह कॉल किस बारे में है।"
translit = "Prateeksha ke liye dhanyavaad. Kripya thoda aur bataiye ki yeh call kis baare mein hai."
[templates.unsupported_language.default]
text = "फ़िलहाल अंग्रेज़ी, हिंदी और कन्नड़ में बात की जा सकती है। कृपया इनमें से किसी एक में बोलिए।"
translit = "Filhaal angrezi, hindi aur kannada mein baat ki ja sakti hai. Kripya inmein se kisi ek mein boliye."
[templates.probe_deflect.default]
text = "क्षमा करें, कोई भी व्यक्तिगत जानकारी साझा नहीं की जा सकती। चाहें तो संदेश छोड़ सकते हैं।"
translit = "Kshama karein, koi bhi vyaktigat jaankari saajha nahin ki ja sakti. Chahein to sandesh chhod sakte hain."
[templates.decline_personal.default]
text = "क्षमा करें, कोई भी व्यक्तिगत जानकारी साझा नहीं की जा सकती।"
translit = "Kshama karein, koi bhi vyaktigat jaankari saajha nahin ki ja sakti."
[templates.injection_refuse.default]
text = "क्षमा करें, काम करने के नियम बदले नहीं जा सकते। केवल संदेश लिया जा सकता है।"
translit = "Kshama karein, kaam karne ke niyam badle nahin ja sakte. Keval sandesh liya ja sakta hai."
[templates.farewell_message.default]
text = "धन्यवाद, संदेश आगे पहुँचा दिया जाएगा। नमस्कार।"
translit = "Dhanyavaad, sandesh aage pahuncha diya jayega. Namaskar."
[templates.owner_ended.default]
text = "यह कॉल अब समाप्त हो रही है। धन्यवाद।"
translit = "Yeh call ab samapt ho rahi hai. Dhanyavaad."
[templates.call_limit.default]
text = "कॉल का समय पूरा हो गया है। धन्यवाद, नमस्कार।"
translit = "Call ka samay poora ho gaya hai. Dhanyavaad, namaskar."
[templates.failed.default]
text = "क्षमा करें, तकनीकी समस्या आ गई है। कृपया बाद में पुनः प्रयास करें। नमस्कार।"
translit = "Kshama karein, takniki samasya aa gayi hai. Kripya baad mein punah prayas karein. Namaskar."
