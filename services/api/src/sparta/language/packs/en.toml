# ---------------------------------------------------------------------------------------------------------------
# Assistant utterances. {owner_poss} / {owner_to} / {owner_subj} are filled from [owner_ref].
# Every disclosure states that the speaker is an AI assistant. None may request protected information.
# ---------------------------------------------------------------------------------------------------------------
[templates.disclosure.concise]
text = "Hi, I'm {owner_poss} AI call assistant. May I know who's calling and what this is regarding?"
[templates.disclosure.warm]
text = "Hello! You've reached {owner_poss} AI call assistant. Could you tell me your name and what your call is about?"
[templates.disclosure.formal]
text = "Good day. I am {owner_poss} AI call assistant. May I have your name and the purpose of your call, please?"
[templates.ask_name.default]
text = "Sorry, could I get your name, please?"
[templates.ask_org.default]
text = "Thanks. And which company or organization are you calling from?"
[templates.ask_purpose.default]
text = "Thanks. And what is this call regarding?"
[templates.clarify_repeat.default]
text = "Sorry, I didn't catch that. Could you say that again?"
[templates.reprompt_silence.default]
text = "Hello, are you still there?"
[templates.close_silence.default]
text = "I can't hear anything, so I'll end the call now. Goodbye."
[templates.refuse_sensitive.default]
text = "I'm sorry, I can't share or accept any personal, financial or security information on this call."
[templates.end_scam.default]
text = "I'm ending this call now. Goodbye."
[templates.end_spam.default]
text = "Thanks for calling, but I can't help with this. Goodbye."
[templates.escalate_hold.default]
text = "Thanks. I'll let {owner_to} know right now. Please stay on the line."
[templates.escalate_waiting.default]
text = "Thanks, I've noted that. {owner_subj} has been notified, so please stay on the line."
[templates.take_message.default]
text = "I'll pass your message along. Could you share a short message and a callback number?"
[templates.safe_continue.default]
text = "Thanks, I've noted that. Is there anything else I should pass along?"
[templates.owner_takeover.default]
text = "{owner_subj} is joining the call now. One moment, please."
[templates.owner_continue.default]
text = "Thanks for holding. Could you tell me a little more about what this is regarding?"
[templates.unsupported_language.default]
text = "I can currently help in English, Hindi or Kannada. Could you please continue in one of these?"
[templates.probe_deflect.default]
text = "I'm sorry, I can't share any personal details. I can take a message if you like."
[templates.decline_personal.default]
text = "I'm sorry, I can't share any personal details."
[templates.injection_refuse.default]
text = "I'm sorry, I can't change how I work. I can only take a message."
[templates.farewell_message.default]
text = "Thanks, I'll pass that along. Goodbye."
[templates.owner_ended.default]
text = "This call is now ending. Goodbye."
[templates.call_limit.default]
text = "I need to wrap up this call now. Goodbye."
[templates.failed.default]
text = "Sorry, I'm having trouble on my side. Please try again later. Goodbye."
