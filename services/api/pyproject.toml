[project]
name = "sparta-api"
version = "0.1.0"
description = "Sparta: multilingual AI call-screening backend (FastAPI modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
# Real provider SDKs. The default simulator/rules stack needs none of these.
azure = [
  "azure-communication-callautomation",
]
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "fakeredis>=2.26",
  "hypothesis>=6.115",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[project.scripts]
sparta = "sparta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparta"]

[tool.hatch.build.targets.sdist]
include = ["src/sparta", "migrations", "alembic.ini", "README.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs external services (PostgreSQL/Redis); skipped unless SPARTA_TEST_POSTGRES_URL / SPARTA_TEST_REDIS_URL are set",
  "slow: slower end-to-end tests",
]
filterwarnings = ["error::DeprecationWarning:sparta.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "PL", "TID"]
ignore = [
  "PLR0913", # many args are normal for service functions
  "PLR0917",
  "PLR2004", # magic values in thresholds are documented in policy files
  "PLR0912",
  "PLR0915",
  "PLR0911", # decision tables legitimately return from many branches
  "PLC0415", # optional provider SDKs are imported lazily on purpose
  "PT018",   # composite assertions read better in table-style tests
  "S101",    # asserts are fine in tests; production code avoids them by review
  "RUF001",  # multilingual strings contain look-alike characters on purpose
  "RUF002",
  "RUF003",
  "E501",    # `ruff format` owns wrapping; remaining long lines are strings/comments where wrapping hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "E501"]
"migrations/**" = ["E501", "I001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sparta"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["azure.*", "alembic.*", "fakeredis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/sparta"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
