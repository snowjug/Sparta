[project]
name = "sparta-api"
version = "0.1.0"
description = "Sparta: multilingual AI call-screening backend (FastAPI modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
# Real provider SDKs. The default simulator/rules stack needs none of these.
azure = [
  "azure-communication-callautomation",
  "azure-cognitiveservices-speech>=1.50",
]
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# Free, open-source speech on this machine (no cloud): faster-whisper (MIT) recognises, Piper (GPL-3.0-or-later) speaks.
# Piper's licence is copyleft, so this extra is never part of the default dependencies, locks or image: choose it on
# purpose. The pins were install-tested on Python 3.12: pip on Windows x64, and on Linux x86-64 through
# requirements-local-speech.lock (the optional SPARTA_LOCAL_SPEECH=1 image build). scipy is not needed: resampling is
# sparta/providers/audio_resample.py. `python -m sparta models fetch` downloads the models; the providers never do.
local-speech = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.9.0",
  "piper-tts==1.8.0",
  "onnxruntime==1.32.0",
  "numpy==2.2.6",
  "av==19.0.2",
  "tokenizers==0.23.3",
  "huggingface-hub==0.36.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.7",
  "mypy>=1.13",
  "fakeredis>=2.26",
  "hypothesis>=6.115",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[project.scripts]
sparta = "sparta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparta"]

# A wheel-only install (the Docker image) must be able to run `python -m sparta migrate`.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "sparta/_migrations"

[tool.hatch.build.targets.sdist]
include = ["src/sparta", "migrations", "alembic.ini", "README.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: needs external services (PostgreSQL/Redis); skipped unless SPARTA_TEST_POSTGRES_URL / SPARTA_TEST_REDIS_URL are set",
  "slow: slower end-to-end tests",
  "local_speech: real faster-whisper / Piper models; skipped unless the local-speech extra is installed and the models are in SPARTA_LOCAL_MODEL_DIR",
  "sip_e2e: Docker end-to-end test with a real Asterisk and a headless SIP client; skipped unless SPARTA_SIP_E2E=1 (python scripts/sip_e2e.py)",
]
filterwarnings = ["error::DeprecationWarning:sparta.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "ASYNC", "PT", "PL", "TID"]
ignore = [
  "PLR0913", # many args are normal for service functions
  "PLR0917",
  "PLR2004", # magic values in thresholds are documented in policy files
  "PLR0912",
  "PLR0915",
  "PLR0911", # decision tables legitimately return from many branches
  "PLC0415", # optional provider SDKs are imported lazily on purpose
  "PT018",   # composite assertions read better in table-style tests
  "S101",    # asserts are fine in tests; production code avoids them by review
  "RUF001",  # multilingual strings contain look-alike characters on purpose
  "RUF002",
  "RUF003",
  "E501",    # `ruff format` owns wrapping; remaining long lines are strings/comments where wrapping hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "PT011", "E501"]
"migrations/**" = ["E501", "I001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sparta"]
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["azure.*", "alembic.*", "fakeredis.*"]
ignore_missing_imports = true

# The optional local-speech engines are imported lazily and are not installed in the default environment.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "piper.*", "ctranslate2.*", "onnxruntime.*", "numpy.*", "scipy.*"]
ignore_missing_imports = true

[tool.bandit]
# `assert` is used for type narrowing only; ruff's S101 policy (production code avoids it by review) is the same.
skips = ["B101"]

[tool.coverage.run]
source = ["src/sparta"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
