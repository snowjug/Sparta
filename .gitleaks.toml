# gitleaks configuration for Sparta (used by .github/workflows/secret-scan.yml and by local runs):
#     gitleaks dir . --config .gitleaks.toml --redact          # working tree
#     gitleaks git . --config .gitleaks.toml --redact          # committed history
# It extends the default rule set. Only dependency/build folders at their exact paths and values that are documented dummies
# are allowlisted; never add a real credential here. A new test fixture that looks like a key must be added below on purpose.
title = "Sparta gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated folders that exist only on a developer machine (git-ignored), by their exact location. A path allowlist hides everything under it from the scan and CI reads this file from the pull request, so never widen these to a pattern that matches at any depth."
paths = [
  '''^apps/web/(node_modules|\.next|test-results|playwright-report|blob-report|coverage)/''',
  '''^apps/android/(\.gradle|\.kotlin|build|app/build)/''',
  '''^services/api/\.venv/''',
]

[[allowlists]]
description = "Lock files whose integrity hashes look like secrets, by exact path"
paths = [
  '''^apps/web/package-lock\.json$''',
  '''^services/api/requirements-dev\.lock$''',
]

[[allowlists]]
description = "Dummy values used by tests and documentation, listed exactly"
regexes = [
  '''sk-live-123456789''',                                  # services/api/tests: log redaction fixture
  '''sk-live-0123456789abcdef''',                          # services/api/tests: provider resilience fixture
  '''c3BhcnRhLXRlc3QtZmluZ2VycHJpbnQtc2FsdC0wMDAx''',      # apps/android tests: base64 of a fake fingerprint salt
  '''sparta-dev-only''',                                   # docker-compose / .env.example development password
  '''sparta-ci-only''',                                    # CI service-container password
  '''ci-placeholder-0123456789''',                         # ci.yml: placeholder so main.bicepparam compiles (not a password)
  '''4633458b-17de-408a-b874-0445c86b69e6''',              # public built-in Azure role id "Key Vault Secrets User" (secretaccess.bicep)
  '''speech-key-SENTINEL-9f3a''',                           # services/api/tests/unit/test_doctor.py: fake Speech key the leak tests assert is never printed
  '''fedcba9876543210fedcba9876543210''',                   # services/api/tests/unit/test_doctor.py: fake Twilio auth token the leak tests assert is never printed
]
