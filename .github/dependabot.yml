# Dependabot: weekly version updates for every ecosystem in the repository, grouped to keep the number of PRs small.
# Security updates are separate and immediate (enable them under Settings > Code security).
version: 2

updates:
  # Python. Dependabot reads services/api/pyproject.toml; it does not understand the lock files, so a version bump also
  # needs them regenerated: requirements-dev.lock first (uv pip compile ... --generate-hashes, see services/api/README.md),
  # then `make lock` (or scripts/lock.ps1) for the runtime requirements*.lock files that the Docker build installs.
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned by major tag (first party) or by commit SHA (third party); Dependabot keeps both current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"

  # postgres and redis images in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
