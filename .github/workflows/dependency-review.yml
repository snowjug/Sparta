# Dependency review: fails a pull request that introduces a dependency with a known high-severity vulnerability.
# Needs the dependency graph (on by default for public repositories; Settings > Advanced Security otherwise).
# This workflow has NOT been run on GitHub by its author. The action is pinned by commit SHA: it publishes no floating v5 tag.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The summary goes to the job summary; commenting would need pull-requests: write, which forks never get.
          comment-summary-in-pr: never
