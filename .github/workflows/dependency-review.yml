# Dependency review: fails a pull request that introduces a dependency with a known high-severity vulnerability.
# Needs the dependency graph (Settings > Advanced Security). Where it is not enabled the job passes with a warning and
# reviews NOTHING: it first asks the endpoint the action itself uses (403 or 404 is what the action reports as "not
# supported on this repository"). On 2026-11-18 the first run on GitHub failed for exactly that reason, so this is how it
# behaves now.
# The action is pinned by commit SHA: it publishes no floating v5 tag.
name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Is the dependency graph available?
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          status="$(gh api -i "repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" 2>/dev/null | head -n 1 | awk '{print $2}' || true)"
          echo "The dependency-graph endpoint answered HTTP ${status:-none}."
          # Where the graph is off this endpoint answers 403 (observed on the first run on GitHub) or 404, and the action then
          # fails with "not supported on this repository". Any other answer means the action can do its job.
          if [ "${status:-}" = "403" ] || [ "${status:-}" = "404" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review skipped::The dependency graph is not enabled for this repository, so nothing was reviewed. Enable it under Settings > Advanced Security (Dependency graph), then re-run this check."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Review dependency changes
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The summary goes to the job summary; commenting would need pull-requests: write, which forks never get.
          comment-summary-in-pr: never
