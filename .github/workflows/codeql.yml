# Static analysis with CodeQL (Python, JavaScript/TypeScript, Java/Kotlin) on pull requests, pushes to main and weekly.
# Results appear under Security > Code scanning. Free for public repositories; private repositories need GitHub Code
# Security. First run on GitHub: pull request 1, 2026-11-18 (it found four alerts, since resolved).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pull requests from forks get a read-only token and cannot upload results: skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17 (the Kotlin analysis needs a real build)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build the Android app for the Java/Kotlin analysis
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
